name: macOS build and verify

# Builds, tests, packages and smoke-tests LaunchMad on a GitHub-hosted macOS
# runner. The packaged ZIP is uploaded as a workflow artifact for inspection;
# publishing a release stays a manual step.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -x
          ls -d /Applications/Xcode*.app || true
          for x in /Applications/Xcode*.app; do
            echo "$x: $(defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null)"
          done
          # Prefer the newest Xcode installed (by version, not by name).
          XCODE="$(for x in /Applications/Xcode*.app; do
              v="$(defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null)" && echo "$v $x"
            done | sort -V | tail -1 | cut -d' ' -f2-)"
          if [[ -n "${XCODE}" ]]; then sudo xcode-select -s "${XCODE}"; fi
          xcodebuild -version
          xcrun swift --version
          xcrun --show-sdk-version
          sw_vers
          uname -m

      - name: Privacy scan
        run: python3 scripts/check_privacy.py

      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild -project LaunchMad.xcodeproj -scheme LaunchMad -configuration Debug \
            -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            build > build-debug.log 2>&1 || {
              echo "::group::Compiler errors"; grep -E "error:|fatal" build-debug.log | sort -u | head -150; echo "::endgroup::"
              tail -60 build-debug.log; exit 1; }
          grep -E "warning:" build-debug.log | grep -v "/DerivedData/" | sort -u > build-warnings.txt || true
          echo "Warnings: $(wc -l < build-warnings.txt)"
          head -80 build-warnings.txt

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project LaunchMad.xcodeproj -scheme LaunchMad -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            > test.log 2>&1 || {
              echo "::group::Failures"; grep -E "error:|failed|XCTAssert|Test Case .* failed" test.log | head -150; echo "::endgroup::"
              tail -80 test.log; exit 1; }
          {
            echo "test cases passed: $(grep -cE "Test [Cc]ase .*passed" test.log || true)"
            echo "test cases failed: $(grep -cE "Test [Cc]ase .*failed" test.log || true)"
            echo "test cases skipped: $(grep -cE "Test [Cc]ase .*skipped" test.log || true)"
            grep -E "Executed [0-9]+ test|\*\* TEST|Test run with" test.log | tail -3 || true
            grep -E "Test [Cc]ase .*skipped" test.log | sort -u || true
          } > test-summary.txt
          cat test-summary.txt

      - name: Package (scripts/release.sh, universal)
        run: |
          set -o pipefail
          UNIVERSAL=1 scripts/release.sh > release.log 2>&1 || { tail -80 release.log; exit 1; }
          sed -n '/==> Verifying bundle/,$p' release.log | grep -v '^    ' | head -60

      - name: Inspect bundle
        run: |
          set -x
          APP=build/DerivedData/Build/Products/Release/LaunchMad.app
          /usr/libexec/PlistBuddy -c Print "$APP/Contents/Info.plist"
          find "$APP" -maxdepth 4 | sort
          find "$APP" -name '*.lproj' -o -name 'SwiftUpdater' -o -name '*.command' | tee unexpected.txt
          test ! -s unexpected.txt
          codesign -d --entitlements - "$APP" || true
          codesign -dvv "$APP" 2>&1 || true
          otool -L "$APP/Contents/MacOS/LaunchMad"
          strings -a "$APP/Contents/MacOS/LaunchMad" | grep -Ei 'https?://' | sort -u || true

      - name: Smoke test the app extracted from the ZIP
        run: |
          set -x
          TEST_DIR="$(mktemp -d)"
          ditto -x -k build/dist/LaunchMad-*.zip "$TEST_DIR"
          codesign --verify --deep --strict "$TEST_DIR/LaunchMad.app"
          # Seed Last used with one missing and one real app: opening the launcher
          # must drop the missing entry. Pinned entries are kept even if missing.
          defaults write com.sadhedgehog.launchmad launchMadRecentAppPaths -array /Applications/LaunchMadMissing.app /System/Applications/Calculator.app
          defaults write com.sadhedgehog.launchmad launchMadPinnedAppPaths -array /System/Applications/Calculator.app /Applications/LaunchMadMissing.app
          "$TEST_DIR/LaunchMad.app/Contents/MacOS/LaunchMad" > app-stdout.txt 2>&1 &
          APP_PID=$!
          sleep 20
          ps -p "$APP_PID" -o pid,stat,etime,command || { echo "LaunchMad exited early"; cat app-stdout.txt; exit 1; }
          for i in 1 2 3; do
            echo "--- sample $i: network sockets"; lsof -nP -a -p "$APP_PID" -i || true
            echo "--- sample $i: unix sockets";   lsof -nP -a -p "$APP_PID" -U || true
            nettop -P -L 1 -p "$APP_PID" -J bytes_in,bytes_out || true
            sleep 5
          done
          echo "--- open files outside system paths"
          lsof -nP -p "$APP_PID" | grep -v -E ' /(System|usr|private/var/db|Library/Apple)/' || true
          echo "--- stdout/stderr (should be empty)"; cat app-stdout.txt
          echo "--- data written"
          ls -la "$HOME/Library/Application Support/LaunchMad" || true
          defaults read com.sadhedgehog.launchmad || true
          ls -la "$HOME/Library/Logs" | grep -i launch || echo "no LaunchMad log folder"
          ls -la "$HOME/Library/Caches" | grep -i -E 'launchmad|launchnext' || echo "no LaunchMad cache folder"
          RECENT="$(defaults read com.sadhedgehog.launchmad launchMadRecentAppPaths | tr -d ' \n')"
          PINNED="$(defaults read com.sadhedgehog.launchmad launchMadPinnedAppPaths | tr -d ' \n')"
          echo "recent=$RECENT pinned=$PINNED"
          kill "$APP_PID" || true
          sleep 2
          kill -9 "$APP_PID" 2>/dev/null || true
          {
            echo "smoke: process ran 35s from the extracted ZIP"
            echo "smoke: network/unix socket samples: see the three lsof samples above"
            echo "smoke: stdout/stderr bytes: $(wc -c < app-stdout.txt | tr -d ' ')"
            echo "smoke: recent after open: $RECENT"
            echo "smoke: pinned after open: $PINNED"
          } > smoke-summary.txt
          [[ "$RECENT" == '("/System/Applications/Calculator.app")' ]] || { echo "Last used was not pruned"; exit 1; }
          [[ "$PINNED" == *LaunchMadMissing* ]] || { echo "Pinned entry was unexpectedly removed"; exit 1; }

      - name: Summary
        if: always()
        run: |
          echo "=== SUMMARY ==="
          xcodebuild -version 2>/dev/null | sed -n 1p
          cat test-summary.txt 2>/dev/null || true
          echo "warnings (app sources): $(grep -c . build-warnings.txt 2>/dev/null || echo n/a)"
          sed 's#^.*/LaunchMad/LaunchMad/##' build-warnings.txt 2>/dev/null | head -40 || true
          cat smoke-summary.txt 2>/dev/null || true
          cat build/dist/SHA256SUMS.txt 2>/dev/null || true
          lipo -archs build/DerivedData/Build/Products/Release/LaunchMad.app/Contents/MacOS/LaunchMad 2>/dev/null || true
          ls -l build/dist 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launchmad-${{ github.sha }}
          path: |
            build/dist/
            build-debug.log
            build-warnings.txt
            test.log
            release.log
            app-stdout.txt
            test-summary.txt
            smoke-summary.txt
          if-no-files-found: ignore
          retention-days: 14
